# Publicación en Render con un solo servicio web (API + sitio) y una base PostgreSQL gratis.
# En Render: New + > Blueprint > elige este repositorio > Apply.
databases:
  - name: celulares-db
    databaseName: empresa_celulares
    user: celulares
    plan: free

services:
  - type: web
    name: tienda-celulares
    runtime: node
    plan: free
    healthCheckPath: /api/salud
    # 1) compila la web (sin datos de ejemplo, usando la API) y la copia dentro de la API
    # 2) instala la API
    buildCommand: >-
      npm --prefix tienda-celulares-web install --include=dev &&
      npm --prefix tienda-celulares-web run build &&
      npm --prefix celulares_api install &&
      rm -rf celulares_api/public &&
      cp -r tienda-celulares-web/dist celulares_api/public
    # La primera vez crea las tablas y carga los datos de prueba; después solo arranca.
    startCommand: npm --prefix celulares_api start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: celulares-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_URL
        value: /api
